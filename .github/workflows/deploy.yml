name: ShopSphere Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

  FRONTEND_ECR_REPOSITORY: kwikit-prod-frontend
  BACKEND_ECR_REPOSITORY: kwikit-prod-backend

  ECS_CLUSTER: kwikit-prod-cluster
  FRONTEND_SERVICE: kwikit-prod-frontend-service
  BACKEND_SERVICE: kwikit-prod-backend-service

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # DEBUG GITHUB OIDC TOKEN
      # Temporary - remove after RCA
      # --------------------------------

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Unable to obtain GitHub OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # JWT uses Base64 URL encoding
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2)
              PAYLOAD="${PAYLOAD}=="
              ;;
            3)
              PAYLOAD="${PAYLOAD}="
              ;;
          esac

          echo ""
          echo "========== OIDC CLAIMS =========="

          echo "$PAYLOAD" \
            | base64 -d \
            | jq '{
                iss,
                aud,
                sub,
                repository,
                repository_id,
                repository_owner,
                repository_owner_id,
                ref,
                ref_type,
                workflow
              }'

          echo "================================="


      # --------------------------------
      # AWS Authentication via OIDC
      # --------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ShopSphere


      # --------------------------------
      # Verify AWS Identity
      # --------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------
      # Login to ECR
      # --------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------
      # Build + Push Frontend
      # --------------------------------

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG \
            ./shopsphere-frontend

          docker push \
            $ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG


      # --------------------------------
      # Build + Push Backend
      # --------------------------------

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG \
            ./shopsphere-backend

          docker push \
            $ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG
            # --------------------------------
      # Deploy Frontend to ECS
      # --------------------------------

      - name: Deploy frontend to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition kwikit-prod-frontend \
            --query taskDefinition)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --task-definition "$NEW_TASK_ARN"


      # --------------------------------
      # Deploy Backend to ECS
      # --------------------------------

      - name: Deploy backend to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition kwikit-prod-backend \
            --query taskDefinition)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_SERVICE" \
            --task-definition "$NEW_TASK_ARN"


      # --------------------------------
      # Wait for deployment
      # --------------------------------

      - name: Wait for ECS services
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$FRONTEND_SERVICE" "$BACKEND_SERVICE"

          echo "Deployment completed successfully"